<main class="login-page">
  <section class="login-form-side">
    <div class="login-form-wrap">
      <div class="eyebrow"><span></span> SYSTEMS MONITORING</div>
      <h1>{{ isRegister() ? 'Create your account' : 'Welcome back' }}</h1>
      <p class="intro">{{ isRegister() ? 'Start monitoring your infrastructure.' : 'Sign in to your operations
        workspace.' }}</p>
      <div class="mode-switch" role="tablist" aria-label="Account access"><button type="button" role="tab"
          [attr.aria-selected]="!isRegister()" [class.selected]="!isRegister()" (click)="isRegister.set(false)">Sign
          in</button><button type="button" role="tab" [attr.aria-selected]="isRegister()"
          [class.selected]="isRegister()" (click)="isRegister.set(true)">Create account</button></div>
      <form (ngSubmit)="submit()"><label for="username">{{ isRegister() ? 'Username' : 'Username or email'
          }}</label><input id="username" name="username" [(ngModel)]="userName" required autocomplete="username"
          [placeholder]="isRegister() ? 'Username' : 'Username or email'" />
        @if (isRegister()) { <label for="email">Email address</label><input id="email" name="email" [(ngModel)]="email"
          required type="email" autocomplete="email" placeholder="Email address" /> }
        <label for="password">Password</label><input id="password" name="password" [(ngModel)]="password" required
          [minlength]="isRegister() ? 12 : 1" type="password" autocomplete="current-password" placeholder="Password" />
        <button class="submit-button" type="submit" [disabled]="busy()">{{ busy() ? 'Connecting…' : isRegister() ?
          'Create account' : 'Sign in' }}<svg lucideIcon="arrow-up-right" [size]="17"></svg></button>
      </form>
    </div>
  </section>
</main>
